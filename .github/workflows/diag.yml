name: Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: false
          script: |
            echo "===== admin config.yaml ====="
            sudo cat /app/ClipSync/admin/api/config/config.yaml
            echo ""
            echo "===== hexdump 前 5 行（检查是否有 BOM/CRLF）====="
            sudo head -5 /app/ClipSync/admin/api/config/config.yaml | xxd | head -20
            echo "===== nginx 中 clipsync 相关 location ====="
            sudo grep -n "clipsync\|28002\|28001\|ClipSync/admin/web" /etc/nginx/conf.d/whteat.conf | head -30
