name: Diagnose

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: false
          script: |
            echo "===== whteat.conf 中 clipsync/admin 相关 ====="
            sudo grep -n -A15 "clipsync/admin" /etc/nginx/conf.d/whteat.conf | head -80
            echo ""
            echo "===== web 目录文件 ====="
            sudo ls -la /app/ClipSync/admin/web/ | head
            sudo ls -la /app/ClipSync/admin/web/assets/ | head
            echo ""
            echo "===== 本地 curl 测试 ====="
            curl -sI http://127.0.0.1/clipsync/admin/assets/index-CA4C-qzI.js -H "Host: www.95qw.com" | head -5
