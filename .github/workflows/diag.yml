name: Diagnose Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 诊断3
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: false
          script: |
            echo "===== server config.yaml ====="
            sudo cat /app/ClipSync/server/config/config.yaml
            echo ""
            echo "===== admin config.yaml（当前） ====="
            sudo cat /app/Clipsync/admin/config/config.yaml 2>/dev/null || echo "不存在"
            echo ""
            echo "===== admin 容器最新日志 ====="
            sudo docker logs --tail 10 clipsync-admin 2>&1
            echo ""
            echo "===== 测试 127.0.0.1:3306 ====="
            timeout 3 bash -c 'echo > /dev/tcp/127.0.0.1/3306' 2>&1 && echo "3306 可达" || echo "3306 不可达"
