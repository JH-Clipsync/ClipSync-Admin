name: Diagnose Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 诊断2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: false
          script: |
            echo "===== server 容器挂载 ====="
            sudo docker inspect clipsync-server --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}'
            echo "===== server config.yaml 位置 ====="
            sudo docker exec clipsync-server cat /data/config/config.yaml 2>&1 | head -60
            echo "===== admin 容器网络模式 ====="
            sudo docker inspect clipsync-admin --format 'NetworkMode={{.HostConfig.NetworkMode}}'
            echo "===== admin 网络列表 ====="
            sudo docker inspect clipsync-admin --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
            echo "===== compose 文件 ====="
            cat /app/Clipsync/admin/docker-compose.yml
