name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Admin image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算小写化的 owner（ghcr.io 命名空间必须全小写）
        id: owner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: "Docker meta (tags: latest / vX.Y.Z / sha)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner_lc }}/clipsync-admin
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: 从 git ref 提取版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "::notice::APP_VERSION=$VER"

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 只有打 tag 时才部署到服务器
  deploy:
    name: Deploy to server via SSH
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 检出部署文件
        uses: actions/checkout@v4

      - name: 等待 GHCR 镜像 manifest 全局传播
        run: |
          sleep 20
          echo "等待 latest 标签在 GHCR 各边缘节点生效..."

      - name: 通过 scp 上传 docker-compose.yml / .env.example
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/.env.example"
          target: "/tmp/clipsync-admin-deploy"
          overwrite: true

      - name: 通过 SSH 拉取镜像并重启
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            DEPLOY_DIR="${{ secrets.DEPLOY_ADMIN_DIR || '/opt/clipsync-admin' }}"
            VERSION="${{ needs.docker.outputs.version }}"

            echo "==> 部署目录: $DEPLOY_DIR"
            echo "==> 版本: $VERSION"
            echo "==> 服务器架构: $(uname -m)"
            echo "==> Docker 版本: $(docker --version)"

            sudo mkdir -p "$DEPLOY_DIR/config" "$DEPLOY_DIR/uploads"

            # 用上传的文件覆盖 docker-compose.yml（每次 CI 都更新）
            sudo cp /tmp/clipsync-admin-deploy/deploy/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"

            # 首次部署时若 .env 不存在，从 example 拷贝
            if [ ! -f "$DEPLOY_DIR/.env" ]; then
              sudo cp /tmp/clipsync-admin-deploy/deploy/.env.example "$DEPLOY_DIR/.env"
              echo "⚠ 已生成 .env 模板：$DEPLOY_DIR/.env"
            fi

            cd "$DEPLOY_DIR"

            # 部署统一使用 latest 标签（和 version tag 指向同一个镜像）
            sudo sed -i '/^ADMIN_TAG=/d;/^WEB_TAG=/d' .env
            echo "ADMIN_TAG=latest" | sudo tee -a .env > /dev/null
            echo "WEB_TAG=latest"   | sudo tee -a .env > /dev/null

            # 拉取最新镜像并重启
            sudo docker compose pull admin web
            sudo docker compose up -d admin web

            # 清理悬空镜像
            sudo docker image prune -f || true
            rm -rf /tmp/clipsync-admin-deploy

            echo "==> 部署完成，容器状态："
            sudo docker compose ps
            echo ""
            echo "==> admin 日志（最后 20 行）："
            sudo docker compose logs --tail=20 admin || true
