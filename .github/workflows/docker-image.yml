name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Admin image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算小写化的 owner（ghcr.io 命名空间必须全小写）
        id: owner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: "Docker meta (tags: latest / vX.Y.Z / sha)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner_lc }}/clipsync-admin
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: 从 git ref 提取版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "::notice::APP_VERSION=$VER"

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 只有打 tag 时才部署到服务器
  deploy:
    name: Deploy to server via SSH
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 检出部署文件
        uses: actions/checkout@v4

      - name: 等待 GHCR 镜像 manifest 全局传播
        run: |
          sleep 20
          echo "等待 latest 标签在 GHCR 各边缘节点生效..."

      - name: 通过 scp 上传 docker-compose.yml / .env.example / config.example.yaml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/.env.example,config.example.yaml"
          target: "/tmp/clipsync-admin-deploy"
          overwrite: true

      - name: 通过 SSH 拉取镜像并重启
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_DIR,VERSION
          script: |
            export DEPLOY_DIR="${{ secrets.DEPLOY_ADMIN_DIR || '/opt/clipsync-admin' }}"
            export VERSION="${{ needs.docker.outputs.version }}"
            bash -c '
              set -ex
              echo "==> whoami: $(whoami)"
              echo "==> 部署目录: $DEPLOY_DIR"
              echo "==> 版本: $VERSION"
              echo "==> 服务器架构: $(uname -m)"
              echo "==> Docker 版本: $(docker --version)"

              # 如果已经是 root 就不用 sudo；否则用 sudo
              if [ "$(id -u)" = "0" ]; then SUDO=""; else SUDO="sudo"; fi
              echo "==> 使用前缀: ${SUDO:-（无）}"

              $SUDO mkdir -p "$DEPLOY_DIR/config" "$DEPLOY_DIR/uploads"

              # 用上传的文件覆盖 docker-compose.yml（每次 CI 都更新）
              $SUDO cp /tmp/clipsync-admin-deploy/deploy/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"

              # 首次部署时若 .env 不存在，从 example 拷贝
              if [ ! -f "$DEPLOY_DIR/.env" ]; then
                $SUDO cp /tmp/clipsync-admin-deploy/deploy/.env.example "$DEPLOY_DIR/.env"
                echo "⚠ 已生成 .env 模板：$DEPLOY_DIR/.env"
              fi

              # config.yaml 迁移逻辑
              if [ -f "$DEPLOY_DIR/config/config.yaml" ]; then
                if $SUDO grep -qE "^\s*addr:\s*\":18082\"" "$DEPLOY_DIR/config/config.yaml"; then
                  $SUDO sed -i -E "s|^(\s*addr:\s*)\":18082\"|\1\":28002\"|" "$DEPLOY_DIR/config/config.yaml"
                  echo "已将 config.yaml 中 app.addr 从 :18082 迁移到 :28002"
                fi
                $SUDO sed -i -E "s|http://127\.0\.0\.1:8080|http://127.0.0.1:28001|g" "$DEPLOY_DIR/config/config.yaml" 2>/dev/null || true
              else
                echo "⚠ $DEPLOY_DIR/config/config.yaml 不存在；已从 example 拷贝，请编辑后重启："
                $SUDO cp /tmp/clipsync-admin-deploy/config.example.yaml "$DEPLOY_DIR/config/config.yaml"
                echo "  sudo vi $DEPLOY_DIR/config/config.yaml"
              fi

              cd "$DEPLOY_DIR"

              # 迁移 .env 中旧默认值
              if $SUDO grep -qE "^WEB_PORT=80$" .env 2>/dev/null; then
                $SUDO sed -i "s/^WEB_PORT=80$/WEB_PORT=28200/" .env
                echo "已将 .env 中 WEB_PORT 从 80 迁移到 28200"
              fi
              if $SUDO grep -q "host.docker.internal:18082" .env 2>/dev/null; then
                $SUDO sed -i "s/host.docker.internal:18082/host.docker.internal:28002/g" .env
                echo "已将 .env 中 ADMIN_UPSTREAM 从 18082 迁移到 28002"
              fi

              # 部署统一使用 latest 标签
              $SUDO sed -i "/^ADMIN_TAG=/d;/^WEB_TAG=/d" .env
              echo "ADMIN_TAG=latest" | $SUDO tee -a .env > /dev/null
              echo "WEB_TAG=latest"   | $SUDO tee -a .env > /dev/null

              # 清除之前可能残留的过期 GHCR 凭据
              $SUDO docker logout ghcr.io >/dev/null 2>&1 || true

              # 拉取最新镜像并重启
              $SUDO docker compose pull admin web
              $SUDO docker compose up -d admin web

              # 清理悬空镜像
              $SUDO docker image prune -f || true
              rm -rf /tmp/clipsync-admin-deploy

              echo "==> 部署完成，容器状态："
              $SUDO docker compose ps
              echo ""
              echo "==> admin 日志（最后 20 行）："
              $SUDO docker compose logs --tail=20 admin || true
            '
