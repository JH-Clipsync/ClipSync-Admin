name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Admin image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算小写化的 owner（ghcr.io 命名空间必须全小写）
        id: owner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: "Docker meta (tags: latest / vX.Y.Z / sha)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner_lc }}/clipsync-admin
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: 从 git ref 提取版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "::notice::APP_VERSION=$VER"

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 只有打 tag 时才部署到服务器
  deploy:
    name: Deploy to server via SSH
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 检出部署文件
        uses: actions/checkout@v4

      - name: 等待 GHCR 镜像 manifest 全局传播
        run: |
          sleep 20
          echo "等待 latest 标签在 GHCR 各边缘节点生效..."

      - name: 通过 scp 上传部署脚本和配置文件
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "deploy/deploy.sh,deploy/docker-compose.yml,deploy/.env.example,deploy/nginx.clipsync.conf,config.example.yaml"
          target: "/tmp/clipsync-admin-deploy"
          overwrite: true

      - name: 通过 SSH 执行部署脚本
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_ADMIN_DIR || '/app/ClipSync/admin/api' }}
          VERSION: ${{ needs.docker.outputs.version }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_DIR,VERSION
          script_stop: true
          script: |
            chmod +x /tmp/clipsync-admin-deploy/deploy/deploy.sh
            bash /tmp/clipsync-admin-deploy/deploy/deploy.sh
