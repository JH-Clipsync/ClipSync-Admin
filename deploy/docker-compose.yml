# ClipSync Admin 部署编排
#
# 首次部署：
#   1. 在服务器创建目录：mkdir -p /opt/clipsync-admin/config /opt/clipsync-admin/uploads
#   2. 手动创建 /opt/clipsync-admin/config/config.yaml（参考仓库 config.example.yaml）
#      - mysql/redis 地址填 127.0.0.1（host 网络模式）
#      - app.addr 用 ":28002"
#      - 上传 url_prefix 建议改成 "/clipsync/admin/static"（配合外层反代）
#   3. 复制 .env.example 为 .env 并按需修改
#   4. docker compose up -d
#
# 更新镜像：
#   docker compose pull && docker compose up -d

name: clipsync-admin

services:
  admin:
    image: ghcr.io/jh-clipsync/clipsync-admin:${ADMIN_TAG:-latest}
    container_name: clipsync-admin
    restart: unless-stopped
    # host 网络：直连宿主机 MySQL/Redis，来源 IP 为 127.0.0.1
    network_mode: host
    command: ["-c", "/data/config/config.yaml"]
    volumes:
      - ./config:/data/config:ro
      - ./uploads:/data/uploads
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/jh-clipsync/clipsync-admin-web:${WEB_TAG:-latest}
    container_name: clipsync-admin-web
    restart: unless-stopped
    depends_on:
      - admin
    ports:
      - "${WEB_PORT:-28200}:80"
    environment:
      - TZ=Asia/Shanghai
      # 生产环境由外层反代（Caddy/Nginx）处理 /clipsync/admin/api，
      # 这里不设 ADMIN_UPSTREAM，容器内 nginx 只托管静态文件
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
