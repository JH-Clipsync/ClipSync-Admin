# ClipSync Admin 后端部署编排
#
# 前端（ClipSync-Admin-Web）为静态文件，部署在 /app/Clipsync/admin/web，
# 由宿主机 nginx 直接托管，不使用容器。
#
# 首次部署：
#   1. mkdir -p /app/Clipsync/admin/config /app/Clipsync/admin/uploads
#   2. deploy.sh 会自动从 Server 配置读取 mysql/redis 信息生成 config.yaml
#   3. docker compose up -d
#
# 更新镜像：
#   docker compose pull && docker compose up -d

name: clipsync-admin

services:
  admin:
    image: ghcr.io/jh-clipsync/clipsync-admin:${ADMIN_TAG:-latest}
    container_name: clipsync-admin
    restart: unless-stopped
    # host 网络：直连宿主机 MySQL/Redis，监听 :28002
    network_mode: host
    command: ["-c", "/data/config/config.yaml"]
    volumes:
      - ./config:/data/config:ro
      - ./uploads:/data/uploads
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
