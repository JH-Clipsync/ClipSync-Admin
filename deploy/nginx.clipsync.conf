# ─────────────────────────────────────────────────────────────
# ClipSync 宿主机 Nginx 配置
#
# 使用方法：
#   1. 把这个文件放到 /etc/nginx/conf.d/clipsync.conf
#      （或在 nginx.conf 的 http {} 里 include 它）
#   2. 确保域名 www.95qw.com 已解析到本机，ssl_certificate 路径正确
#   3. nginx -t && nginx -s reload
#
# 路径映射：
#   /clipsync/admin/api/    → 127.0.0.1:28002/api/       (Admin 后端 API)
#   /clipsync/admin/static/ → 127.0.0.1:28002/static/    (Admin 上传文件)
#   /clipsync/admin/        → /app/ClipSync/admin/web/   (Admin 前端静态文件)
#   /clipsync/ws            → 127.0.0.1:28001/ws         (WebSocket)
#   /clipsync/push          → 127.0.0.1:28001/push       (HTTP 推送)
#   /clipsync/auth/         → 127.0.0.1:28001/auth/      (C 端认证)
#   /clipsync/admin/kick    → 127.0.0.1:28001/admin/     (Admin → Server 内部调用)
#   /clipsync/              → 127.0.0.1:28001/           (其他 Server 接口)
# ─────────────────────────────────────────────────────────────

# HTTP → HTTPS
server {
    listen 80;
    server_name www.95qw.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.95qw.com;

    # SSL 证书（按实际路径修改；用 certbot 的话通常是这两个路径）
    ssl_certificate     /etc/letsencrypt/live/www.95qw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.95qw.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 12m;

    # ── Admin 后端 API（比 /clipsync/admin/ 静态路径更具体，必须放前面）──
    location ^~ /clipsync/admin/api/ {
        proxy_pass http://127.0.0.1:28002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Admin 上传文件 ──
    location ^~ /clipsync/admin/static/ {
        proxy_pass http://127.0.0.1:28002/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    # ── Admin 前端静态文件（/clipsync/admin/ → /app/ClipSync/admin/web/）──
    location ^~ /clipsync/admin/assets/ {
        alias /app/ClipSync/admin/web/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /clipsync/admin/ {
        alias /app/ClipSync/admin/web/;
        index index.html;
        try_files $uri $uri/ /clipsync/admin/index.html;
    }

    # ── ClipSync Server WebSocket（独立 location，HTTP/1.1 + Upgrade）──
    location = /clipsync/ws {
        proxy_pass http://127.0.0.1:28001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── ClipSync Server 其他所有接口 ──
    #    包含 /auth/* /push /admin/kick /health 等
    location /clipsync/ {
        proxy_pass http://127.0.0.1:28001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 你原有的其他 location 配置（根路径、其他站点等）放在这里
    # location / { ... }
}
